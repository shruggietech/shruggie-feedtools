[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shruggie-feedtools"
dynamic = ["version"]
description = "Normalize web feed data from diverse sources into a single, predictable JSON schema. Also constructs schema-compliant feed output from arbitrary text input using template files."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "William Thompson / ShruggieTech LLC" },
]
keywords = ["rss", "atom", "feed", "parser", "json-feed", "wordpress", "normalize"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2", "pygments>=2.17", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
shruggie-feedtools = "shruggie_feedtools.cli.main:main"

[project.urls]
Homepage = "https://github.com/shruggietech/shruggie-feedtools"
Repository = "https://github.com/shruggietech/shruggie-feedtools"

[tool.hatch.version]
path = "src/shruggie_feedtools/_version.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
